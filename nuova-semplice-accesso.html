function home(){

function siteTotals(s){
 const hours=S.hours.filter(x=>x.site_id===s.id),payableHours=hours.filter(x=>x.is_payable!==false),entries=S.costs.filter(x=>x.site_id===s.id),adjustments=S.laborAdjustments.filter(x=>x.site_id===s.id),receipts=S.receipts.filter(x=>x.site_id===s.id),invoices=S.invoices.filter(x=>x.site_id===s.id),receivables=S.items.filter(x=>x.site_id===s.id&&x.item_type==='receivable'&&!['done','cancelled'].includes(x.status));
 const receiptTotal=receipts.reduce((n,x)=>n+Number(x.amount||0),0),registeredReceived=Number(s.collected_amount||0),invoiceAmount=invoices.reduce((n,x)=>n+Number(x.amount||0),0),invoiceOpen=invoices.reduce((n,x)=>n+Math.max(0,Number(x.amount||0)-Number(x.collected_amount||0)),0),costTotal=entries.reduce((n,x)=>n+Number(x.amount||0),0),adjustmentCost=adjustments.reduce((n,x)=>n+Number(x.amount||0),0),timeTotal=payableHours.reduce((n,x)=>n+timeCost(x),0),laborCost=adjustmentCost+timeTotal;
