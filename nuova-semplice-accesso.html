<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>
:root{--g:#176b48;--g2:#e9f3ed;--bg:#f5f7f4;--ink:#202923;--muted:#758078;--line:#e4e9e4;--white:#fff;--red:#a53b34;--gold:#805719}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:560px;margin:auto;min-height:100dvh;padding-bottom:86px}.top{background:var(--g);color:#fff;padding:17px 18px 19px;border-radius:0 0 23px 23px}.brand{font-size:18px;font-weight:850}.brand small{display:block;font-size:10px;letter-spacing:1px;opacity:.75;margin-top:2px}.toprow{display:flex;justify-content:space-between;align-items:center}.workselect{border:1px solid #ffffff55;background:#ffffff18;color:#fff;border-radius:10px;padding:7px 9px;max-width:195px;font-size:12px}.workselect option{color:#222}.greet{font-size:12px;opacity:.78;margin-top:19px}.top h1{font-size:23px;margin:4px 0 0;letter-spacing:-.5px}.sync{font-size:10px;opacity:.7;margin-top:7px}main{padding:16px}.sectiontitle{display:flex;align-items:end;justify-content:space-between;margin:17px 1px 10px}.sectiontitle h2{font-size:17px;margin:0}.sectiontitle small{color:var(--muted);font-size:11px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:11px}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:13px 0}.metric{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px}.metric small{display:block;color:var(--muted);font-size:11px;margin-bottom:7px}.metric b{font-size:19px;letter-spacing:-.5px}.metric em{display:block;font-size:10px;color:var(--muted);font-style:normal;margin-top:4px}.item{padding:11px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}.item:first-child{border-top:0;padding-top:1px}.item b{font-size:13px}.item small{display:block;color:var(--muted);font-size:11px;margin-top:4px;line-height:1.35}.value{font-size:12px;font-weight:800;white-space:nowrap}.badge{display:inline-block;border-radius:99px;padding:4px 8px;background:var(--g2);color:var(--g);font-size:10px;font-weight:750;white-space:nowrap}.badge.gray{background:#eef0ee;color:#59635c}.badge.red{background:#fae9e7;color:var(--red)}.muted{color:var(--muted);font-size:12px}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.actions button{border:1px solid var(--line);border-radius:14px;background:#fff;text-align:left;padding:13px;font-size:12px;font-weight:750;color:var(--ink)}.actions span{display:block;color:var(--g);font-size:20px;margin-bottom:6px}.primary{border:0;background:var(--g);color:white;font-weight:750;border-radius:12px;padding:12px 15px}.secondary{border:1px solid var(--line);background:#fff;border-radius:11px;padding:8px 10px;color:var(--g);font-size:11px;font-weight:750}.full{width:100%}.nav{position:fixed;z-index:4;bottom:0;left:50%;transform:translateX(-50%);width:min(560px,100%);padding:8px 4px calc(8px + env(safe-area-inset-bottom));background:#ffffffee;backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:space-around}.nav button{border:0;background:transparent;color:#818b83;flex:1;font-size:10px;font-weight:700;padding:4px}.nav button span{display:block;font-size:19px;margin-bottom:3px}.nav button.on{color:var(--g)}.pagehead{margin:2px 1px 15px}.pagehead h1{margin:0;font-size:23px;letter-spacing:-.5px}.pagehead p{margin:5px 0 0;color:var(--muted);font-size:12px}.form label{display:block;font-size:11px;font-weight:750;margin:12px 0 5px}.form input,.form select,.form textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;background:#fbfcfa;color:var(--ink)}.form textarea{min-height:62px;resize:vertical}.form .primary{margin-top:15px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.tabs{display:flex;gap:5px;padding:4px;background:#e9ede9;border-radius:12px;margin-bottom:12px}.tabs button{flex:1;border:0;background:transparent;border-radius:9px;padding:9px 4px;color:var(--muted);font-size:11px;font-weight:750}.tabs button.on{background:#fff;color:var(--g);box-shadow:0 2px 6px #0000000c}.notice{background:#fff7e8;border:1px solid #f0e4cc;color:var(--gold);border-radius:12px;padding:11px;font-size:11px;line-height:1.45;margin:12px 0}.empty{padding:17px 7px;text-align:center;color:var(--muted);font-size:12px}.toolbar{display:flex;gap:8px;align-items:center}.toolbar select{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px;font-size:11px}.authwrap{padding:28px 18px}.authcard{max-width:400px;margin:14vh auto 0;background:#fff;border:1px solid var(--line);padding:22px;border-radius:20px}.authcard h1{font-size:23px;margin:0}.authcard p{color:var(--muted);font-size:12px}.msg{color:var(--red);font-size:11px;margin-top:9px}.toast{position:fixed;z-index:10;bottom:85px;left:50%;transform:translateX(-50%);background:#202923;color:#fff;border-radius:11px;padding:11px 15px;font-size:12px;opacity:0;transition:.2s;pointer-events:none}.toast.show{opacity:1}.hidden{display:none!important}
</style></head>
<body><div id="root"></div><div id="toast" class="toast"></div>
<script>
(()=>{'use strict';
const URL='https://rdxaxsosqiudklhvezuq.supabase.co',KEY='sb_publishable_abewBdHybtalh7RsfWbXUA_oOLebqMn';
const sb=window.supabase?.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const S={user:null,workspaces:[],workspace:null,sites:[],hours:[],costs:[],schedule:[],receipts:[],invoices:[],materials:[],items:[],fiscalProfile:null,fiscalParams:null,deadlines:[],fiscalPayments:[],tab:'home',form:'hours'};
const $=s=>document.querySelector(s),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(Number(n||0));
const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Rome',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const dateLabel=x=>x?new Intl.DateTimeFormat('it-IT',{timeZone:'Europe/Rome',day:'2-digit',month:'short'}).format(new Date(x+'T12:00:00')):'';
const site=id=>S.sites.find(x=>x.id===id),siteLabel=id=>site(id)?.client_name||site(id)?.name||'Generale';
function toast(s){const x=$('#toast');x.textContent=s;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2200)}
function pageError(e){console.error(e);toast(e?.message||'Qualcosa è andato storto')}
async function start(){
 const {data:{session}}=await sb.auth.getSession();S.user=session?.user||null;
 if(!S.user){login();return}
 const {data:members,error}=await sb.from('workspace_members').select('workspace_id,role').eq('user_id',S.user.id);
 if(error)throw error;
 const allowed=(members||[]).filter(m=>['owner','admin'].includes(m.role)).map(m=>m.workspace_id);
 const {data:ws,error:we}=await sb.from('workspaces').select('id,name,kind').in('id',allowed).eq('active',true).order('name');if(we)throw we;
 S.workspaces=ws||[];if(!S.workspaces.length){$('#root').innerHTML='<div class="authwrap"><div class="authcard"><h1>Accesso non autorizzato</h1><p>Questo account non ha accesso amministratore agli spazi aziendali.</p><button class="secondary" onclick="appLogout()">Esci</button></div></div>';return}
 S.workspace=(S.workspaces.find(x=>x.kind==='company')||S.workspaces[0]).id;await load();render();
}
function login(){ $('#root').innerHTML=`<div class="authwrap"><form class="authcard form" id="login"><div class="brand" style="color:var(--g)">SERVIDIO<small>GESTIONE SEMPLICE</small></div><h1 style="margin-top:20px">Accedi senza password</h1><p>Inserisci l’email del tuo account Servidio OS. Ti invieremo un link personale per entrare.</p><label>Email</label><input name="email" type="email" autocomplete="email" required><button class="primary full" type="submit">Mandami il link</button><div class="msg" id="loginmsg" role="status" aria-live="polite"></div></form></div>`;
 $('#login').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),email=String(f.get('email')||'').trim();const btn=e.currentTarget.querySelector('button[type="submit"]'),msg=$('#loginmsg');btn.disabled=true;btn.textContent='Invio…';msg.textContent='';const redirectTo=window.location.origin+window.location.pathname;const {error}=await sb.auth.signInWithOtp({email,options:{shouldCreateUser:false,emailRedirectTo:redirectTo}});btn.disabled=false;btn.textContent='Mandami il link';if(error){msg.textContent='Non sono riuscito a inviare il link. Controlla l’email oppure riprova tra poco.';console.error(error);return}msg.style.color='var(--g)';msg.textContent='Link inviato. Apri l’email e tocca il pulsante per entrare.'};
}
async function load(){
 const wid=S.workspace;
 const yr=Number(today().slice(0,4));
 const [sites,hours,costs,schedule,receipts,invoices,materials,items,profile,params,deadlines,payments]=await Promise.all([
 sb.from('sites').select('id,name,client_name,location,status,contract_value,collected_amount,workspace_id').eq('workspace_id',wid).order('name'),
 sb.from('time_entries').select('id,site_id,work_date,hours,hourly_cost,worker_name_snapshot,payable_hours,cost_amount_override,payment_status,is_payable,note').eq('workspace_id',wid).order('work_date',{ascending:false}).limit(5000),
 sb.from('cost_entries').select('id,site_id,category,description,amount,paid,due_date,entry_date').eq('workspace_id',wid).order('entry_date',{ascending:false}).limit(3000),
 sb.from('company_schedule').select('id,site_id,schedule_date,scheduled_at,title,notes,status').eq('workspace_id',wid).neq('status','cancelled').order('schedule_date').limit(500),
 sb.from('cash_receipts').select('id,site_id,amount,fiscal_year,received_date,date_confirmed,note,receipt_type').eq('workspace_id',wid).order('received_date',{ascending:false}).limit(2000),
 sb.from('invoices').select('id,site_id,number,customer_name,issue_date,amount,collected_amount,status,notes').eq('workspace_id',wid).order('issue_date',{ascending:false}).limit(1000),
 sb.from('material_requests').select('id,site_id,item,quantity,unit,note,status,priority,created_at').eq('workspace_id',wid).eq('status','requested').order('created_at',{ascending:false}).limit(500),
 sb.from('personal_items').select('id,site_id,item_type,title,details,status,due_at,remind_at,scope,category,contact_name').eq('user_id',S.user.id).eq('workspace_id',wid).neq('status','done').neq('status','cancelled').order('due_at',{ascending:true,nullsFirst:false}).limit(500),
 sb.from('fiscal_profiles').select('regime,start_date,profitability_coefficient,coefficient_confirmed,substitute_tax_rate,tax_rate_confirmed,social_security_scheme,inps_reduction_pct,start_year_limit_override,fixed_inps_installment_amount,fixed_inps_installment_months,notes').eq('workspace_id',wid).maybeSingle(),
 sb.from('fiscal_year_params').select('year,forfettario_limit,immediate_exit_limit').eq('year',yr).maybeSingle(),
 sb.from('deadlines').select('id,title,due_date,amount_due,amount_paid,status,category,notes').eq('workspace_id',wid).order('due_date').limit(200),
 sb.from('fiscal_payments').select('id,tax_year,category,description,due_date,amount_due,paid_amount,status').eq('workspace_id',wid).eq('tax_year',yr).order('due_date').limit(200)
 ]);
 for(const q of [sites,hours,costs,schedule,receipts,invoices,materials,items,profile,params,deadlines,payments])if(q.error)throw q.error;
 S.sites=sites.data||[];S.hours=hours.data||[];S.costs=costs.data||[];S.schedule=schedule.data||[];S.receipts=receipts.data||[];S.invoices=invoices.data||[];S.materials=materials.data||[];S.items=items.data||[];S.fiscalProfile=profile.data||null;S.fiscalParams=params.data||null;S.deadlines=deadlines.data||[];S.fiscalPayments=payments.data||[];
}
function nav(){return `<nav class="nav">${[['home','⌂','Oggi'],['sites','▤','Cantieri'],['add','＋','Inserisci'],['finance','€','Finanze'],['week','▦','Programma']].map(([id,ic,n])=>`<button class="${S.tab===id?'on':''}" onclick="appTab('${id}')"><span>${ic}</span>${n}</button>`).join('')}</nav>`}
function shell(content){const w=S.workspaces.find(x=>x.id===S.workspace);return `<div class="app"><header class="top"><div class="toprow"><div class="brand">SERVIDIO<small>GESTIONE SEMPLICE</small></div><select class="workselect" onchange="appWorkspace(this.value)">${S.workspaces.map(x=>`<option value="${x.id}" ${x.id===S.workspace?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="greet">${esc(S.user?.email||'Account')} · ${esc(w?.kind==='personal_company'?'azienda personale':'azienda')}</div><h1>${S.tab==='home'?'La tua giornata':S.tab==='sites'?'Cantieri':S.tab==='add'?'Inserisci':S.tab==='finance'?'Finanze':'Programma'}</h1><div class="sync">Dati aggiornati · ${dateLabel(today())}</div></header><main>${content}</main>${nav()}</div>`}
function item(title,sub,right=''){return `<div class="item"><div><b>${esc(title)}</b><small>${esc(sub)}</small></div><div class="value">${right}</div></div>`}
function card(title,rows,action=''){return `<div class="sectiontitle"><h2>${title}</h2>${action}</div><div class="card">${rows||'<div class="empty">Nessun dato registrato</div>'}</div>`}
function home(){
 const now=today(),daySchedule=S.schedule.filter(x=>x.schedule_date===now),hoursToday=S.hours.filter(x=>x.work_date===now).reduce((n,x)=>n+Number(x.hours||0),0),costMonth=S.costs.filter(x=>(x.entry_date||'').slice(0,7)===now.slice(0,7)).reduce((n,x)=>n+Number(x.amount||0),0),active=S.sites.filter(x=>!['completed','closed','cancelled'].includes(String(x.status||'').toLowerCase()));
 const dayItems=S.items.filter(x=>(x.due_at||x.remind_at||'').slice(0,10)===now),events=[...daySchedule.map(x=>item(x.title,[x.scheduled_at?new Intl.DateTimeFormat('it-IT',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Rome'}).format(new Date(x.scheduled_at)):'',siteLabel(x.site_id),x.notes].filter(Boolean).join(' · '),'<span class="badge">Oggi</span>')),...dayItems.map(x=>item(x.title,[siteLabel(x.site_id),x.contact_name,x.details].filter(Boolean).join(' · '),'<span class="badge gray">Promemoria</span>'))].join('');
 return `<div class="metrics"><div class="metric"><small>Cantieri attivi</small><b>${active.length}</b><em>nei due spazi aziendali</em></div><div class="metric"><small>Ore oggi</small><b>${hoursToday} h</b><em>registrate per la squadra</em></div><div class="metric"><small>Spese questo mese</small><b>${money(costMonth)}</b><em>cantiere e azienda</em></div><div class="metric"><small>Ore già archiviate</small><b>${S.hours.length}</b><em>storico mantenuto</em></div></div>
 <div class="sectiontitle"><h2>Oggi</h2><button class="secondary" onclick="appTab('week')">Vedi settimana</button></div><div class="card">${events||'<div class="empty">Nessun lavoro in programma oggi.</div>'}</div>
 <div class="sectiontitle"><h2>Aggiungi al volo</h2></div><div class="actions"><button onclick="appForm('hours')"><span>◷</span>Ore operaio</button><button onclick="appForm('cost')"><span>€</span>Spesa o materiale</button><button onclick="appForm('event')"><span>▦</span>Lavoro / sopralluogo</button><button onclick="appForm('receipt')"><span>＋</span>Incasso ricevuto</button></div>
 ${card('Cantieri attivi',active.slice(0,4).map(s=>item(s.client_name||s.name,[s.location,s.name].filter(Boolean).join(' · '),'<span class="badge">'+(s.status==='planned'?'In programma':'Aperto')+'</span>')).join(''))}`
}
function sitesPage(){const rows=S.sites.map(s=>{const h=S.hours.filter(x=>x.site_id===s.id).reduce((a,x)=>a+Number(x.hours||0),0),c=S.costs.filter(x=>x.site_id===s.id).reduce((a,x)=>a+Number(x.amount||0),0);return `<div class="item"><div><b>${esc(s.client_name||s.name)}</b><small>${esc([s.name,s.location].filter(Boolean).join(' · '))}<br>${h} ore · spese ${money(c)}</small></div><span class="badge ${s.status==='completed'?'gray':''}">${esc(s.status==='completed'?'Concluso':s.status==='planned'?'In programma':'Attivo')}</span></div>`}).join('');return `<div class="pagehead"><h1>Tutti i cantieri</h1><p>Ogni cantiere raccoglie le sue ore, spese e materiali.</p></div><div class="card">${rows||'<div class="empty">Nessun cantiere</div>'}</div><div class="notice">Qui ritrovi i cantieri esistenti. La prova usa lo stesso archivio, non una copia.</div>`}
function input(label,name,type='text',opts={}){return `<label>${label}</label><input name="${name}" type="${type}" ${opts.value!==undefined?`value="${esc(opts.value)}"`:''} ${opts.step?`step="${opts.step}"`:''} ${opts.required?'required':''} ${opts.min!==undefined?`min="${opts.min}"`:''} placeholder="${opts.placeholder||''}">`}
function siteSelect(required=false){return `<label>Cantiere</label><select name="site_id" ${required?'required':''}><option value="">${required?'Seleziona cantiere':'Generale / nessun cantiere'}</option>${S.sites.map(s=>`<option value="${s.id}">${esc(s.client_name||s.name)}</option>`).join('')}</select>`}
function addPage(){
 const types=[['hours','Ore'],['cost','Spesa'],['material','Da comprare'],['event','Programma'],['receipt','Incasso']],tabs=`<div class="tabs">${types.map(([id,n])=>`<button class="${S.form===id?'on':''}" onclick="appForm('${id}')">${n}</button>`).join('')}</div>`;
 let fields='';
 if(S.form==='hours')fields=`<div class="grid2">${input('Data','work_date','date',{value:today(),required:true})}${input('Ore','hours','number',{step:'0.25',min:'0.25',placeholder:'Es. 8',required:true})}</div>${siteSelect(true)}${input('Nome operaio','worker_name_snapshot','text',{placeholder:'Es. Valerio',required:true})}<div class="grid2">${input('Costo €/ora (facoltativo)','hourly_cost','number',{step:'0.01',min:'0',placeholder:'Es. 18'})}${input('Ore da pagare','payable_hours','number',{step:'0.25',min:'0',placeholder:'Uguale alle ore'})}</div><label>Nota</label><textarea name="note" placeholder="Lavorazione o informazione utile"></textarea>`;
 if(S.form==='cost')fields=`<div class="grid2">${input('Data','entry_date','date',{value:today(),required:true})}${input('Importo €','amount','number',{step:'0.01',min:'0.01',placeholder:'0,00',required:true})}</div><label>Tipo di spesa</label><select name="category"><option value="materials">Materiale acquistato</option><option value="labor">Spesa operai</option><option value="fuel">Carburante</option><option value="meal">Pranzo</option><option value="travel">Trasferta / sopralluogo</option><option value="general">Spesa generale</option><option value="extra">Extra</option></select>${siteSelect(false)}<label>Descrizione</label><input name="description" placeholder="Es. sacchi di rasante, carburante…"><label>Stato</label><select name="paid"><option value="true">Già pagata</option><option value="false">Da pagare</option></select>`;
 if(S.form==='material')fields=`${input('Materiale da comprare','item','text',{placeholder:'Es. rasante, nastro, piastrelle',required:true})}<div class="grid2">${input('Quantità (facoltativa)','quantity','number',{step:'0.01',min:'0',placeholder:'Es. 5'})}${input('Unità','unit','text',{placeholder:'sacchi, pezzi, m²'})}</div>${siteSelect(false)}<label>Nota</label><input name="note" placeholder="Marca, misura o negozio">`;
 if(S.form==='event')fields=`<div class="grid2">${input('Giorno','schedule_date','date',{value:today(),required:true})}${input('Ora (facoltativa)','time','time')}</div>${siteSelect(false)}${input('Lavoro o appuntamento','title','text',{placeholder:'Es. cantiere, sopralluogo cliente',required:true})}<label>Note</label><textarea name="notes" placeholder="Squadra, indirizzo o dettagli"></textarea>`;
 if(S.form==='receipt')fields=`<div class="grid2">${input('Data incasso','received_date','date',{value:today(),required:true})}${input('Importo €','amount','number',{step:'0.01',min:'0.01',placeholder:'0,00',required:true})}</div>${siteSelect(false)}<label>Per cosa</label><select name="receipt_type"><option value="invoice">Fattura / saldo</option><option value="deposit">Acconto</option><option value="other">Altro</option></select><label>Nota</label><input name="note" placeholder="Riferimento semplice">`;
 return `<div class="pagehead"><h1>Inserimento rapido</h1><p>Una registrazione alla volta, con pochi campi.</p></div>${tabs}<form class="card form" id="entry">${fields}<button class="primary full" type="submit">Salva</button></form>`;
}
function finance(){const year=Number($('#fyear')?.value||today().slice(0,4)),receipts=S.receipts.filter(x=>x.fiscal_year===year),confirmed=receipts.filter(x=>x.date_confirmed).reduce((n,x)=>n+Number(x.amount||0),0),invoices=S.invoices.filter(x=>String(x.issue_date||'').startsWith(String(year))),invoiced=invoices.reduce((n,x)=>n+Number(x.amount||0),0),costs=S.costs.filter(x=>(x.entry_date||'').startsWith(String(year))).reduce((n,x)=>n+Number(x.amount||0),0),limit=Number(S.fiscalProfile?.start_year_limit_override||S.fiscalParams?.forfettario_limit||0),pct=limit?Math.min(100,Math.round(invoiced/limit*100)):0,payments=S.fiscalPayments.filter(x=>x.status!=='paid').map(x=>item(x.description||x.category,`${dateLabel(x.due_date)} · da versare ${money(Math.max(0,Number(x.amount_due||0)-Number(x.paid_amount||0)))}`,`<span class="badge red">${esc(x.status||'Da pagare')}</span>`)).join(''),deadlines=S.deadlines.filter(x=>x.due_date>=today()&&!['paid','done','completed'].includes(String(x.status||'').toLowerCase())).slice(0,8).map(x=>item(x.title,`${dateLabel(x.due_date)}${x.notes?' · '+x.notes:''}`,Number(x.amount_due||0)>0?money(Math.max(0,Number(x.amount_due)-Number(x.amount_paid||0))):'<span class="badge">Scadenza</span>')).join('');return `<div class="pagehead"><h1>Finanze</h1><p>Forfettario · fatture, incassi e scadenze separate</p></div><div class="toolbar"><select id="fyear" onchange="render()">${[year,year-1,year-2].map(y=>`<option ${y===year?'selected':''}>${y}</option>`).join('')}</select><span class="muted">Movimenti già presenti</span></div>${limit?`<div class="card"><div class="row"><b>Limite forfettario ${year}</b><span class="value">${money(invoiced)} / ${money(limit)}</span></div><div style="height:7px;background:#edf0ed;border-radius:9px;margin:11px 0 6px"><div style="height:7px;width:${pct}%;background:var(--g);border-radius:9px"></div></div><small class="muted">${money(Math.max(0,limit-invoiced))} di margine sul limite indicato</small>${S.fiscalProfile?.start_year_limit_override?'<div class="sub">Limite personalizzato già impostato per l’anno di avvio.</div>':''}</div>`:''}<div class="metrics"><div class="metric"><small>Fatture emesse · ${year}</small><b>${money(invoiced)}</b><em>conteggio per data fattura</em></div><div class="metric"><small>Incassi registrati · ${year}</small><b>${money(confirmed)}</b><em>solo date confermate</em></div><div class="metric"><small>Spese annotate · ${year}</small><b>${money(costs)}</b><em>controllo interno</em></div><div class="metric"><small>Fatture aperte</small><b>${invoices.filter(x=>Number(x.amount||0)>Number(x.collected_amount||0)).length}</b><em>da seguire</em></div></div>${card('Versamenti fiscali da pagare',payments)}${card('Prossime scadenze',deadlines)}${card('Ultimi incassi',receipts.slice(0,7).map(x=>item(x.note||'Incasso',`${dateLabel(x.received_date)} · ${siteLabel(x.site_id)}`,money(x.amount))).join(''))}${card('Fatture recenti',invoices.slice(0,7).map(x=>item(x.customer_name||`Fattura ${x.number||''}`,`${dateLabel(x.issue_date)} · ${x.status||'registrata'}`,money(x.amount))).join(''))}${card('Materiale da acquistare',S.materials.slice(0,6).map(x=>item(x.item,[x.quantity?`${x.quantity} ${x.unit||''}`:'',siteLabel(x.site_id),x.note].filter(Boolean).join(' · '),'<span class="badge">Da comprare</span>')).join(''))}<div class="notice">Il monitoraggio usa i dati registrati nell’app. Verifica col commercialista soglie, scadenze e importi fiscali prima di versare.</div>`}
function week(){const events=[...S.schedule.filter(x=>x.schedule_date>=today()).map(x=>({date:x.schedule_date,title:x.title,sub:[x.scheduled_at?new Intl.DateTimeFormat('it-IT',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Rome'}).format(new Date(x.scheduled_at)):'',siteLabel(x.site_id),x.notes].filter(Boolean).join(' · '),done:x.status==='done'})),...S.items.filter(x=>(x.due_at||x.remind_at||'').slice(0,10)>=today()).map(x=>({date:(x.due_at||x.remind_at).slice(0,10),title:x.title,sub:[siteLabel(x.site_id),x.contact_name,x.details].filter(Boolean).join(' · '),done:false}))].sort((a,b)=>a.date.localeCompare(b.date)).slice(0,40);const rows=events.map(x=>item(x.title,`${dateLabel(x.date)}${x.sub?' · '+x.sub:''}`,`<span class="badge ${x.done?'gray':''}">${x.done?'Fatto':'In programma'}</span>`)).join('');return `<div class="pagehead"><h1>Programma</h1><p>Impegni esistenti e nuovi lavori in un solo elenco.</p></div><button class="primary full" onclick="appForm('event');appTab('add')">＋ Aggiungi lavoro o sopralluogo</button><div class="sectiontitle"><h2>Prossimi impegni</h2></div><div class="card">${rows||'<div class="empty">Nessun impegno futuro inserito.</div>'}</div>`}
function render(){const w=S.workspaces.find(x=>x.id===S.workspace);let c=S.tab==='home'?home():S.tab==='sites'?sitesPage():S.tab==='add'?addPage():S.tab==='finance'?finance():week();$('#root').innerHTML=shell(c);$('#entry')?.addEventListener('submit',submit)}
async function submit(e){e.preventDefault();const d=Object.fromEntries(new FormData(e.currentTarget).entries()),base={workspace_id:S.workspace};let table,row;
 if(S.form==='hours'){table='time_entries';row={...base,site_id:d.site_id,user_id:S.user.id,work_date:d.work_date,hours:Number(d.hours),hourly_cost:d.hourly_cost?Number(d.hourly_cost):null,worker_name_snapshot:d.worker_name_snapshot,payable_hours:d.payable_hours?Number(d.payable_hours):Number(d.hours),is_payable:true,payment_status:'unpaid',note:d.note||null,source:'simple_app'};}
 if(S.form==='cost'){table='cost_entries';row={...base,site_id:d.site_id||null,category:d.category,description:d.description||null,amount:Number(d.amount),paid:d.paid==='true',entry_date:d.entry_date,created_by:S.user.id,source:'simple_app'};}
 if(S.form==='event'){table='company_schedule';row={...base,site_id:d.site_id||null,schedule_date:d.schedule_date,scheduled_at:d.time?new Date(`${d.schedule_date}T${d.time}`).toISOString():null,title:d.title,notes:d.notes||null,status:'planned',created_by:S.user.id};}
 if(S.form==='material'){table='material_requests';row={...base,site_id:d.site_id||null,requested_by:S.user.id,item:d.item,quantity:d.quantity?Number(d.quantity):null,unit:d.unit||null,note:d.note||null,status:'requested',priority:'normal'};}
 if(S.form==='receipt'){table='cash_receipts';row={...base,site_id:d.site_id||null,amount:Number(d.amount),fiscal_year:Number(d.received_date.slice(0,4)),received_date:d.received_date,date_confirmed:true,note:d.note||null,created_by:S.user.id,receipt_type:d.receipt_type};}
 const btn=e.currentTarget.querySelector('button[type=submit]');btn.disabled=true;btn.textContent='Salvataggio…';const {error}=await sb.from(table).insert(row);if(error){btn.disabled=false;btn.textContent='Salva';pageError(error);return}await load();S.tab=S.form==='event'?'week':S.form==='receipt'?'finance':'home';render();toast('Registrazione salvata')
}
window.appTab=t=>{S.tab=t;render()};window.appForm=f=>{S.form=f;S.tab='add';render()};window.appWorkspace=async id=>{S.workspace=id;try{await load();render()}catch(e){pageError(e)}};window.appLogout=async()=>{await sb.auth.signOut();location.reload()};
sb.auth.onAuthStateChange(()=>{});start().catch(e=>{console.error(e);$('#root').innerHTML=`<div class="authwrap"><div class="authcard"><h1>Errore nel caricamento</h1><p>Ricarica la pagina. Se continua, controlliamo accesso e connessione.</p><button class="secondary" onclick="location.reload()">Ricarica</button></div></div>`});
})();
</script></body></html>
