<script>
(()=>{'use strict';
const URL='https://rdxaxsosqiudklhvezuq.supabase.co',KEY='sb_publishable_abewBdHybtalh7RsfWbXUA_oOLebqMn';
const sb=window.supabase?.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const S={user:null,workspaces:[],workspace:null,sites:[],hours:[],costs:[],laborAdjustments:[],schedule:[],calendarSchedule:null,calendarSites:null,calendarItems:null,receipts:[],invoices:[],materials:[],items:[],equipment:[],fiscalProfile:null,fiscalParams:null,deadlines:[],fiscalPayments:[],tab:'home',form:'hours',siteDetailId:null,siteSelectionMode:false,selectedSiteIds:[],editScheduleId:null,draftScheduleId:null,editMaterialId:null,weekOffset:0,loading:false};

function deviceToken(){return new URLSearchParams(location.hash.slice(1)).get('device')||''}

async function openDirectSession(){
 const token=deviceToken();if(!token)return null;opening();
 const response=await fetch(`${URL}/functions/v1/owner-device-auth`,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({device_token:token})});
 const payload=await response.json().catch(()=>({}));if(!response.ok)throw new Error(payload.error==='invalid_device'?'Collegamento personale non valido':'Accesso diretto temporaneamente non disponibile');
 const {data,error}=await sb.auth.setSession({access_token:payload.access_token,refresh_token:payload.refresh_token});if(error)throw error;return data.session||null
}
async function start(){
 let {data:{session}}=await sb.auth.getSession();if(!session&&deviceToken())session=await openDirectSession();S.user=session?.user||null;
 if(!S.user){login();return}
 const {data:members,error}=await sb.from('workspace_members').select('workspace_id,role').eq('user_id',S.user.id);
 if(error)throw error;
 const allowed=(members||[]).filter(m=>['owner','admin'].includes(m.role)).map(m=>m.workspace_id);
 const {data:ws,error:we}=await sb.from('workspaces').select('id,name,kind').in('id',allowed).eq('active',true).order('name');if(we)throw we;
 S.workspaces=ws||[];if(!S.workspaces.length){$('#root').innerHTML='<div class="authwrap"><div class="authcard"><h1>Accesso non autorizzato</h1><p>Questo account non ha accesso amministratore agli spazi aziendali.</p><button class="secondary" onclick="appLogout()">Esci</button></div></div>';return}
 S.workspace=(S.workspaces.find(x=>x.kind==='company')||S.workspaces[0]).id;await load();render();
}
function login(){ $('#root').innerHTML=`<div class="authwrap"><div class="authcard"><div class="brand" style="color:var(--g)">SERVIDIO<small>GESTIONE SEMPLICE</small></div><h1 style="margin-top:20px">Usa il collegamento personale</h1><p>Questa versione non richiede nome, email, PIN o password. Aprila dal collegamento personale di Matteo e salvala sulla schermata Home.</p></div></div>`;
}
async function load(){
 const wid=S.workspace;
 const yr=Number(today().slice(0,4));
 const [sites,hours,costs,laborAdjustments,schedule,receipts,invoices,materials,items,equipment,profile,params,deadlines,payments]=await Promise.all([
 sb.from('sites').select('id,name,client_name,location,status,contract_value,invoiced_amount,collected_amount,data_completeness,planned_start_date,planned_end_date,estimated_workdays,workspace_id,deleted_at').eq('workspace_id',wid).order('name'),
 sb.from('time_entries').select('id,site_id,work_date,hours,hourly_cost,worker_name_snapshot,payable_hours,cost_amount_override,payment_status,is_payable,note').eq('workspace_id',wid).order('work_date',{ascending:false}).limit(5000),
 sb.from('cost_entries').select('id,site_id,category,description,amount,paid,due_date,entry_date').eq('workspace_id',wid).order('entry_date',{ascending:false}).limit(3000),
 sb.from('site_labor_adjustments').select('id,site_id,worker_name,period_label,hours,amount,paid,note,created_at').eq('workspace_id',wid).order('created_at',{ascending:false}).limit(3000),
 sb.from('company_schedule').select('id,site_id,schedule_date,scheduled_at,title,notes,status,metadata,updated_at').eq('workspace_id',wid).neq('status','cancelled').order('schedule_date').limit(500),
 sb.from('cash_receipts').select('id,site_id,amount,fiscal_year,received_date,date_confirmed,note,receipt_type,invoice_id,invoice_required').eq('workspace_id',wid).order('received_date',{ascending:false}).limit(2000),
 sb.from('invoices').select('id,site_id,number,customer_name,issue_date,amount,collected_amount,status,notes').eq('workspace_id',wid).order('issue_date',{ascending:false}).limit(1000),
 sb.from('material_requests').select('id,site_id,item,quantity,unit,note,status,priority,created_at').eq('workspace_id',wid).eq('status','requested').order('created_at',{ascending:false}).limit(500),
 sb.from('personal_items').select('id,site_id,item_type,title,details,status,due_at,remind_at,scope,category,contact_name,amount,metadata').eq('user_id',S.user.id).eq('workspace_id',wid) .order('due_at',{ascending:true,nullsFirst:false}).limit(500),
 sb.from('equipment_assets').select('id,workspace_id,name,current_site_id,location_kind,location_note,assigned_on,created_at').in('workspace_id',S.workspaces.map(x=>x.id)).order('name').limit(500),
 sb.from('fiscal_profiles').select('regime,start_date,profitability_coefficient,coefficient_confirmed,substitute_tax_rate,tax_rate_confirmed,social_security_scheme,inps_reduction_pct,start_year_limit_override,fixed_inps_installment_amount,fixed_inps_installment_months,notes').eq('workspace_id',wid).maybeSingle(),
 sb.from('fiscal_year_params').select('year,forfettario_limit,immediate_exit_limit').eq('year',yr).maybeSingle(),
 sb.from('deadlines').select('id,title,due_date,amount_due,amount_paid,status,category,notes').eq('workspace_id',wid).order('due_date').limit(200),
 sb.from('fiscal_payments').select('id,tax_year,category,description,due_date,amount_due,paid_amount,status').eq('workspace_id',wid).eq('tax_year',yr).order('due_date').limit(200)
 ]);
 for(const q of [sites,hours,costs,laborAdjustments,schedule,receipts,invoices,materials,items,equipment,profile,params,deadlines,payments])if(q.error)throw q.error;
 if(S.workspace!==wid)return; // A superseded workspace request must never replace current data.
 S.sites=sites.data||[];S.hours=hours.data||[];S.costs=costs.data||[];S.laborAdjustments=laborAdjustments.data||[];S.schedule=schedule.data||[];S.calendarSchedule=null;S.calendarSites=null;S.calendarItems=null;S.receipts=receipts.data||[];S.invoices=invoices.data||[];S.materials=materials.data||[];S.items=items.data||[];S.equipment=equipment.data||[];S.fiscalProfile=profile.data||null;S.fiscalParams=params.data||null;S.deadlines=deadlines.data||[];S.fiscalPayments=payments.data||[];
 const workspaceIds=S.workspaces.map(x=>x.id),[calendarSchedule,calendarSites,calendarItems]=await Promise.all([
  sb.from('company_schedule').select('id,workspace_id,site_id,schedule_date,scheduled_at,title,notes,status,metadata,updated_at').in('workspace_id',workspaceIds).neq('status','cancelled').order('schedule_date').limit(1000),
  sb.from('sites').select('id,workspace_id,name,client_name,deleted_at').in('workspace_id',workspaceIds).limit(2000),
  sb.from('personal_items').select('id,workspace_id,site_id,item_type,status,category,contact_name,amount,metadata').eq('user_id',S.user.id).in('workspace_id',workspaceIds).eq('item_type','receivable').limit(2000)
 ]);
 for(const q of [calendarSchedule,calendarSites,calendarItems])if(q.error)throw q.error;
 if(S.workspace!==wid)return;
 S.calendarSchedule=calendarSchedule.data||[];S.calendarSites=calendarSites.data||[];S.calendarItems=calendarItems.data||[];
}
function nav(){return `<nav class="nav">${[['home','⌂','Oggi'],['sites','▤','Cantieri'],['add','＋','Inserisci'],['finance','€','Finanze'],['week','▦','Programma'],['equipment','🧰','Attrezzi']].map(([id,ic,n])=>`<button class="${S.tab===id?'on':''}" onclick="appTab('${id}')"><span>${ic}</span>${n}</button>`).join('')}</nav>`}

function card(title,rows,action=''){return `<div class="sectiontitle"><h2>${title}</h2>${action}</div><div class="card">${rows||'<div class="empty">Nessun dato registrato</div>'}</div>`}

function adjustmentDay(x){const p=String(x.period_label||'').trim(),iso=p.match(/^(\d{4}-\d{2}-\d{2})$/),it=p.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);return iso?iso[1]:it?`${it[3]}-${it[2]}-${it[1]}`:''}
function adjustmentPeriodLabel(x){return dateLabel(adjustmentDay(x))||x.period_label||'Periodo non indicato'}
function home(){
 const now=today(),todayHours=S.hours.filter(x=>x.work_date===now),todayAdjustments=S.laborAdjustments.filter(x=>adjustmentDay(x)===now),hoursToday=workedHours(todayHours,todayAdjustments),costMonth=S.costs.filter(x=>(x.entry_date||'').slice(0,7)===now.slice(0,7)).reduce((n,x)=>n+Number(x.amount||0),0),active=S.sites.filter(x=>!x.deleted_at&&x.status==='active');
 const events=programRows(programEvents().filter(x=>x.date===now),false);
 const todayHoursRows=[...todayHours.map(x=>item(x.worker_name_snapshot||'Operaio',[siteLabel(x.site_id),`${Number(x.hours||0)} ore`,x.payment_status==='unpaid'?'Da pagare':x.payment_status==='paid'?'Pagato':'Da verificare',laborPriceLabel(x),x.note].filter(Boolean).join(' · '),money(timeCost(x)))),...todayAdjustments.map(x=>item(x.worker_name||'Operaio',[siteLabel(x.site_id),x.hours?`${Number(x.hours)} ore`:'Prezzo fisso',x.paid?'Pagato':'Da pagare',x.note].filter(Boolean).join(' · '),money(x.amount)))].join('');
 return `<div class="metrics"><div class="metric"><small>Cantieri attivi</small><b>${active.length}</b><em>nell’azienda selezionata</em></div><div class="metric"><small>Ore oggi</small><b>${hoursToday} h</b><em>registrazioni + storico operai</em></div><div class="metric"><small>Spese questo mese</small><b>${money(costMonth)}</b><em>cantiere e azienda</em></div><div class="metric"><small>Ore lavorate totali</small><b>${workedHours(S.hours,S.laborAdjustments)} h</b><em>tutto lo storico dell’azienda</em></div></div>
 <div class="sectiontitle"><h2>Oggi</h2><button class="secondary" onclick="appTab('week')">Vedi settimana</button></div><div class="card">${events||'<div class="empty">Nessun lavoro in programma oggi.</div>'}</div>
 <div class="sectiontitle"><h2>Aggiungi al volo</h2></div><div class="actions"><button onclick="appForm('hours')"><span>◷</span>Ore operaio</button><button onclick="appForm('cost')"><span>€</span>Spesa o materiale</button><button onclick="appForm('event')"><span>▦</span>Lavoro / sopralluogo</button><button onclick="appForm('reminder')"><span>♧</span>Promemoria</button><button onclick="appForm('receipt')"><span>＋</span>Incasso ricevuto</button></div>
 ${card('Ore operai di oggi',todayHoursRows)}
 ${card('Cantieri attivi',active.slice(0,4).map(s=>item(s.client_name||s.name,[s.location,s.name].filter(Boolean).join(' · '),'<span class="badge">'+(s.status==='planned'?'In programma':'Aperto')+'</span>')).join(''))}`
}

}

  if([fixedCost,hourlyCost].some(x=>x!==''&&(!Number.isFinite(Number(x))||Number(x)<0))){pageError(new Error('Inserisci un costo maggiore o uguale a zero'));return}
  if(hours===0){table='site_labor_adjustments';row={...base,site_id:d.site_id,worker_name:d.worker_name_snapshot.trim(),period_label:d.work_date,hours:0,amount:Number(fixedCost),paid:d.payment_status==='paid',note:d.note||null,source:'simple_app_fixed_price',created_by:S.user.id};}

 }
 if(S.form==='cost'){table='cost_entries';row={...base,site_id:d.site_id||null,category:d.category,description:d.description||null,amount:Number(d.amount),paid:d.paid==='true',entry_date:d.entry_date,created_by:S.user.id,source:'simple_app'};}
 if(S.form==='event'){table='company_schedule';row={...base,site_id:d.site_id||null,schedule_date:d.schedule_date,scheduled_at:d.time?new Date(`${d.schedule_date}T${d.time}`).toISOString():null,title:d.title,notes:d.notes||null,status:'planned',created_by:S.user.id};}
 if(S.form==='material'){table='material_requests';row={...base,site_id:d.site_id||null,requested_by:S.user.id,item:d.item,quantity:d.quantity?Number(d.quantity):null,unit:d.unit||null,note:d.note||null,status:'requested',priority:'normal'};}
 if(S.form==='reminder'){if(d.time&&!d.reminder_date){pageError(new Error('Per indicare un’ora, scegli anche il giorno'));return}const dueDate=d.reminder_date?new Date(`${d.reminder_date}T12:00:00`).toISOString():null,remindAt=d.reminder_date&&d.time?new Date(`${d.reminder_date}T${d.time}`).toISOString():null;table='personal_items';row={...base,user_id:S.user.id,site_id:d.site_id||null,item_type:'task',scope:'company',title:d.title,details:d.details||null,status:'open',priority:'normal',due_at:dueDate,remind_at:remindAt,category:'reminder'};}
 if(S.form==='receipt'){
  if(!['advance','balance','other'].includes(d.receipt_type)){pageError(new Error('Seleziona Acconto, Saldo o Altro'));return}
  if(d.site_id&&!S.sites.some(x=>x.id===d.site_id&&!x.deleted_at)){pageError(new Error('Seleziona un cantiere dell’azienda attuale'));return}

  if(invoiceId){const invoice=receiptInvoices(d.site_id).find(x=>x.id===invoiceId);if(!invoice){pageError(new Error('Seleziona una fattura del cantiere indicato'));return}}
  table='cash_receipts';row={...base,site_id:d.site_id||null,amount:Number(d.amount),fiscal_year:Number(d.received_date.slice(0,4)),received_date:d.received_date,date_confirmed:true,note:d.note||null,created_by:S.user.id,receipt_type:d.receipt_type,invoice_id:invoiceId,invoice_required:d.invoice_id==='__to_invoice__'||!!invoiceId};}
 const btn=e.currentTarget.querySelector('button[type=submit]');btn.disabled=true;btn.textContent='Salvataggio…';const {error}=await sb.from(table).insert(row);if(error){btn.disabled=false;btn.textContent='Salva';pageError(error);return}if(S.form==='hours'&&d.site_id){const q=await sb.from('sites').update({status:'active'}).eq('id',d.site_id).eq('status','planned');if(q.error){btn.disabled=false;pageError(q.error);return}}await load();S.tab=['event','reminder','material'].includes(S.form)?'week':S.form==='receipt'?'finance':'home';render();toast('Registrazione salvata')
}
